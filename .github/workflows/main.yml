name: Update LS Central RSS feed

on:
  schedule:
    # Runs every 6 hours. Edit this if you want it more/less frequent.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" manually in the Actions tab

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Generate feed.xml
        run: python scrape_feed.py

      - name: Commit updated feed
        run: |
          git config user.name "ls-central-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feed.xml
          git diff --quiet --cached || git commit -m "Update feed.xml"
          git push
